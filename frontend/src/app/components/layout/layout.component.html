<div class="d-flex vh-100 overflow-hidden bg-dark text-white">
  <div
    class="d-flex flex-column flex-shrink-0 p-3 bg-black border-end border-secondary"
    style="width: 250px"
  >
    <a
      routerLink="/admin/dashboard"
      class="d-flex align-items-center mb-3 mb-md-0 me-md-auto text-white text-decoration-none px-2"
    >
      <span class="fs-5 fw-bold text-primary">🛍️ E-Commerce Admin</span>
    </a>
    <hr class="border-secondary my-2" />
    <ul class="nav nav-pills flex-column mb-auto gap-1">
      @for (item of navItems; track item.path) {
        <li class="nav-item">
          <a
            [routerLink]="item.path"
            routerLinkActive="active"
            class="nav-link text-white d-flex align-items-center gap-2"
          >
            <span>{{ item.icon }}</span> {{ item.label }}
          </a>
        </li>
      }
    </ul>
    <hr class="border-secondary my-2" />
    <div class="dropdown">
      <button
        class="btn btn-outline-danger btn-sm w-100 d-flex align-items-center justify-content-center gap-2"
        (click)="logout()"
      >
        <span>🚪</span> Logout
      </button>
    </div>
  </div>

  <div class="flex-grow-1 d-flex flex-column h-100 overflow-auto bg-dark p-4">
    <app-toast></app-toast>
    <app-confirm-modal></app-confirm-modal>
    <router-outlet></router-outlet>
  </div>
</div>
